<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <title>BudgetMap — Affordable Eats in Bengaluru</title>
    <meta name="description" content="Crowdsourced map of affordable eats in Bengaluru, ₹100 or under. No login needed to browse or post." />

    <!-- https://budgetmap.in (apex) is the canonical origin — confirmed
         live (Stage 2B-5): budgetmap.in serves production directly, and
         www.budgetmap.in 308-redirects to it, the reverse of the old
         beggarsmap.com setup (where www was canonical and apex redirected
         to it). See CLAUDE.md's Stage 2B entry. -->
    <link rel="canonical" href="https://budgetmap.in/" />

    <!-- Open Graph (WhatsApp/Facebook/iMessage/Slack link previews) and
         Twitter/X cards. Beggars Map spreads by being pasted into WhatsApp
         groups (see AGENTS.md) — before this, every one of those pastes
         rendered as a bare grey link with no image, which is the single
         highest-leverage SEO/sharing fix available (CTO audit, K/L). The
         share image is web/public/og-image.png — on-brand (the real "B"
         mark + wordmark + accent color from Logo.tsx/styles.css), built
         for this purpose, not a screenshot of the app itself. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BudgetMap" />
    <meta property="og:title" content="BudgetMap — Affordable Eats in Bengaluru" />
    <meta property="og:description" content="Crowdsourced map of affordable eats in Bengaluru, ₹100 or under. No login needed to browse or post." />
    <meta property="og:url" content="https://budgetmap.in/" />
    <meta property="og:image" content="https://budgetmap.in/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BudgetMap — Affordable Eats in Bengaluru" />
    <meta name="twitter:description" content="Crowdsourced map of affordable eats in Bengaluru, ₹100 or under. No login needed to browse or post." />
    <meta name="twitter:image" content="https://budgetmap.in/og-image.png" />

    <!-- Google Search Console / Bing Webmaster Tools ("preparation", per
         the remediation plan's P8-2 and Stage 2C of the BudgetMap
         migration — verification itself needs an actual account, which
         this environment has no credentials for). robots.txt and
         sitemap.xml (web/public/) are both already in place and are the
         other half of what each console needs, both already pointed at
         budgetmap.in; once verified via either method below, submit
         https://budgetmap.in/sitemap.xml in Search Console.
         Option A — meta tag: request a verification code from
         https://search.google.com/search-console (Add property ->
         budgetmap.in -> HTML tag), then replace the empty content=""
         below with it.
         Option B — DNS TXT record (works for Bing too, and covers both
         budgetmap.in and www in one go): usually the less brittle
         choice for a domain already managed outside this repo.
    <meta name="google-site-verification" content="" />
    -->

    <!-- Cloudflare Web Analytics + GA4 are loaded conditionally at runtime
         by initAnalytics() (web/src/lib/analytics.ts, called from
         main.tsx) — not as static tags here — so that either one is
         skipped entirely when its env var isn't set, rather than loading
         with a blank id. Set VITE_GA4_MEASUREMENT_ID /
         VITE_CLOUDFLARE_BEACON_TOKEN in web/.env to enable. -->

    <link href="https://maps.googleapis.com" rel="preconnect" />
    <link href="https://maps.gstatic.com" rel="preconnect" crossorigin />
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
